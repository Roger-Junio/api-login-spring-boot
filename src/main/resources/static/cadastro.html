<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <title>Cadastro</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/style.css">

</head>




<body>

  

<div class="container">

    <div class="card">

        <h1>Criar Conta</h1>

        <form>

            <input
                    type="text"
                    placeholder="Nome Completo" 
                    id="campoNome">
           
                    <input
                    type="text"
                    placeholder="CPF" 
                    id="campoCpf">

                    <input
                    type="email"
                    id="campoEmail"
                    placeholder="E-mail">

        
            <input
                    type="password"
                    placeholder="Senha" id="campoSenha">

            <button type="button" onclick="botaoCadastra()">

                Cadastrar

            </button>

        </form>

        <a href="login.html">
            Já possui conta?
        </a>

    </div>

</div>

</body>
</html>
